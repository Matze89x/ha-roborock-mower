name: Release

# Creates the GitHub release HACS installs from. Either push a tag "vX.Y.Z"
# whose version matches manifest.json, or run this workflow by hand with the
# tag (and, if the tag does not exist yet, the commit to put it on -- default:
# the tip of the branch it runs on). The release text is that version's
# section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, e.g. v0.1.1
        required: true
      target:
        description: Commit to tag if the tag does not exist yet (default: branch tip)
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the commit to release
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
          else
            git checkout -q "${TARGET:-$GITHUB_SHA}"
          fi
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check that the tag matches manifest.json
        run: |
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/roborock_mower/manifest.json'))['version'])")
          if [ "${TAG#v}" != "$manifest" ]; then
            echo "Tag $TAG does not match manifest version $manifest"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '$0 == "## " v || index($0, "## " v " ") == 1 {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the highest version is marked "latest", so publishing an
          # older version afterwards does not demote the current release.
          highest=$( (git tag --list 'v*'; echo "$TAG") | sort -V | tail -n 1)
          latest=false
          [ "$TAG" = "$highest" ] && latest=true
          gh release create "$TAG" --target "$SHA" --title "${TAG#v}" \
            --notes-file notes.md --latest="$latest"
